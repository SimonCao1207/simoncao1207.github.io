<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">Example figure</title>
  <desc id="figDesc">A placeholder line chart showing a value decaying from 96 to 13 over eight steps.</desc>

  <style>
    .t  { font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif; }
    .ti { font-size: 17px; font-weight: 600; fill: #1a1d23; }
    .ax { font-size: 12px; fill: #6b7280; }
    .lb { font-size: 12px; font-weight: 600; fill: #2f6db5; }
  </style>

  <rect width="720" height="360" fill="#ffffff"/>

  <text class="t ti" x="64" y="32">Example figure</text>

  <!-- gridlines (recessive) -->
  <g stroke="#e6e8ec" stroke-width="1">
    <line x1="64" y1="70"    x2="700" y2="70"/>
    <line x1="64" y1="127.5" x2="700" y2="127.5"/>
    <line x1="64" y1="185"   x2="700" y2="185"/>
    <line x1="64" y1="242.5" x2="700" y2="242.5"/>
  </g>
  <line x1="64" y1="300" x2="700" y2="300" stroke="#d3d7de" stroke-width="1"/>

  <!-- y axis -->
  <g class="t ax" text-anchor="end">
    <text x="54" y="74">100</text>
    <text x="54" y="131.5">75</text>
    <text x="54" y="189">50</text>
    <text x="54" y="246.5">25</text>
    <text x="54" y="304">0</text>
  </g>

  <!-- x axis -->
  <g class="t ax" text-anchor="middle">
    <text x="64" y="322">1</text>
    <text x="154.86" y="322">2</text>
    <text x="245.71" y="322">3</text>
    <text x="336.57" y="322">4</text>
    <text x="427.43" y="322">5</text>
    <text x="518.29" y="322">6</text>
    <text x="609.14" y="322">7</text>
    <text x="700" y="322">8</text>
    <text x="382" y="346">step</text>
  </g>
  <text class="t ax" transform="rotate(-90 20 185)" x="20" y="185" text-anchor="middle">value</text>

  <!-- series -->
  <polyline fill="none" stroke="#2f6db5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
            points="64,79.2 154.86,95.3 245.71,120.6 336.57,155.1 427.43,194.2 518.29,228.7 609.14,254 700,270.1"/>
  <g fill="#2f6db5" stroke="#ffffff" stroke-width="2">
    <circle cx="64" cy="79.2" r="4"/>
    <circle cx="154.86" cy="95.3" r="4"/>
    <circle cx="245.71" cy="120.6" r="4"/>
    <circle cx="336.57" cy="155.1" r="4"/>
    <circle cx="427.43" cy="194.2" r="4"/>
    <circle cx="518.29" cy="228.7" r="4"/>
    <circle cx="609.14" cy="254" r="4"/>
    <circle cx="700" cy="270.1" r="4"/>
  </g>

  <!-- selective direct labels: first and last only -->
  <text class="t lb" x="64" y="67" text-anchor="start">96</text>
  <text class="t lb" x="700" y="258" text-anchor="end">13</text>
</svg>
